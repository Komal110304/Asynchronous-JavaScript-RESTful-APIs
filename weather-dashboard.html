<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Dashboard</title>
<style>
  :root {
    --bg: #eaf1f5; --surface: #ffffff; --ink: #14303f; --muted: #5d7685;
    --accent: #0b6e99; --line: #cfdde6; --error-bg: #fde8e6; --error-ink: #8a1f14;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1b24; --surface: #162833; --ink: #e6f0f5; --muted: #8fa9b8;
      --accent: #5cc0e8; --line: #27414f; --error-bg: #3a1b18; --error-ink: #ffb4aa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 16px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input {
    flex: 1; padding: 12px 14px; font: inherit; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  }
  button {
    padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--bg); border: 0; border-radius: 8px;
  }
  button:disabled { opacity: .6; cursor: wait; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .error { background: var(--error-bg); color: var(--error-ink); border-color: transparent; }
  .place { color: var(--muted); margin: 0; }
  .temp { font-size: 4.5rem; font-weight: 700; line-height: 1.1; margin: 4px 0; }
  .cond { font-size: 1.2rem; margin: 0 0 20px; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0; }
  .metrics div { border-top: 2px solid var(--line); padding-top: 8px; }
  .metrics dt { color: var(--muted); font-size: .9rem; }
  .metrics dd { margin: 0; font-size: 1.4rem; font-weight: 600; }
  h2 { font-size: 1.1rem; margin: 28px 0 8px; }
  .forecast { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; list-style: none; padding: 0; margin: 0; }
  .forecast li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: center; font-size: .9rem; }
  .forecast strong { display: block; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Weather dashboard</h1>

  <form id="search-form">
    <input id="city" type="search" placeholder="Search a city, e.g. Delhi" aria-label="City name" required autocomplete="off">
    <button id="submit" type="submit">Search</button>
  </form>

  <div id="status" role="status" aria-live="polite" class="panel" hidden></div>

  <section id="current" class="panel" hidden>
    <p class="place" id="place"></p>
    <p class="temp" id="temp"></p>
    <p class="cond" id="cond"></p>
    <dl class="metrics">
      <div><dt>Feels like</dt><dd id="feels"></dd></div>
      <div><dt>Humidity</dt><dd id="humidity"></dd></div>
      <div><dt>Wind speed</dt><dd id="wind"></dd></div>
    </dl>
  </section>

  <section id="forecast-wrap" hidden>
    <h2>7-day forecast</h2>
    <ul class="forecast" id="forecast"></ul>
  </section>
</main>

<script>
  // Open-Meteo: free public REST API, no API key required.
  const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";
  const WEATHER_URL = "https://api.open-meteo.com/v1/forecast";

  // WMO weather codes -> readable text
  const WEATHER_CODES = {
    0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
    45: "Fog", 48: "Rime fog", 51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
    61: "Light rain", 63: "Rain", 65: "Heavy rain", 71: "Light snow", 73: "Snow", 75: "Heavy snow",
    80: "Rain showers", 81: "Rain showers", 82: "Violent showers",
    95: "Thunderstorm", 96: "Thunderstorm with hail", 99: "Thunderstorm with hail"
  };
  const describe = (code) => WEATHER_CODES[code] ?? "Unknown conditions";

  const $ = (id) => document.getElementById(id);
  const form = $("search-form"), input = $("city"), submitBtn = $("submit");
  const statusBox = $("status"), current = $("current"), forecastWrap = $("forecast-wrap");

  // Generic fetch wrapper: checks HTTP status and parses JSON, throwing readable errors.
  async function fetchJSON(url) {
    let response;
    try {
      response = await fetch(url);
    } catch {
      throw new Error("Network error. Check your internet connection and try again.");
    }
    if (!response.ok) {
      throw new Error(`The weather service returned an error (HTTP ${response.status}). Try again shortly.`);
    }
    return response.json();
  }

  // Step 1: city name -> coordinates
  async function geocode(city) {
    const url = `${GEO_URL}?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
    const data = await fetchJSON(url);
    if (!data.results || data.results.length === 0) {
      throw new Error(`No city found for "${city}". Check the spelling or try a nearby city.`);
    }
    return data.results[0]; // { name, latitude, longitude, country, admin1, ... }
  }

  // Step 2: coordinates -> weather
  async function getWeather(lat, lon) {
    const params = new URLSearchParams({
      latitude: lat, longitude: lon, timezone: "auto",
      current: "temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code",
      daily: "weather_code,temperature_2m_max,temperature_2m_min"
    });
    return fetchJSON(`${WEATHER_URL}?${params}`);
  }

  function showStatus(message, isError = false) {
    statusBox.textContent = message;
    statusBox.className = "panel" + (isError ? " error" : "");
    statusBox.hidden = false;
  }

  // Render nested JSON: data.current / data.current_units / data.daily (parallel arrays)
  function render(place, data) {
    const { current: c, current_units: u, daily: d } = data;
    const region = [place.name, place.admin1, place.country].filter(Boolean).join(", ");

    $("place").textContent = region;
    $("temp").textContent = `${Math.round(c.temperature_2m)}${u.temperature_2m}`;
    $("cond").textContent = describe(c.weather_code);
    $("feels").textContent = `${Math.round(c.apparent_temperature)}${u.apparent_temperature}`;
    $("humidity").textContent = `${c.relative_humidity_2m}${u.relative_humidity_2m}`;
    $("wind").textContent = `${c.wind_speed_10m} ${u.wind_speed_10m}`;

    const list = $("forecast");
    list.replaceChildren();
    d.time.forEach((date, i) => {
      const li = document.createElement("li");
      const day = new Date(date + "T00:00").toLocaleDateString("en", { weekday: "short" });
      li.innerHTML = `<strong>${day}</strong>
        <span>${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°</span><br>
        <span>${describe(d.weather_code[i])}</span>`;
      list.append(li);
    });

    statusBox.hidden = true;
    current.hidden = false;
    forecastWrap.hidden = false;
  }

  async function search(city) {
    submitBtn.disabled = true;
    current.hidden = true;
    forecastWrap.hidden = true;
    showStatus("Loading weather…");
    try {
      const place = await geocode(city);
      const data = await getWeather(place.latitude, place.longitude);
      render(place, data);
    } catch (err) {
      showStatus(err.message, true);
    } finally {
      submitBtn.disabled = false;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const city = input.value.trim();
    if (city) search(city);
  });

  // Load a default city on start
  search("Delhi");
</script>
</body>
</html>
